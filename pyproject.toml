[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biffile_data"
version = "0.1.0"
description = "大文件数据存储 — large file data storage library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
biffile = "biffile_data.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
